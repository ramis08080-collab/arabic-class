<script>
{

 const m=await sb.from('group_members').select('group_id').eq('student_id',D.user.id);if(m.error)throw m.error;
 if(!m.data.length){D.group=null;return}
 const gid=m.data[0].group_id;
 const [g,mem,asg,subs,prog]=await Promise.all([sb.from('groups').select('*').eq('id',gid).single(),sb.from('group_members').select('student_id').eq('group_id',gid),sb.from('assignments').select('*').eq('group_id',gid).order('due_date'),sb.from('submissions').select('*').eq('student_id',D.user.id),sb.from('word_progress').select('*').eq('student_id',D.user.id)]);
 for(const r of [g,mem,asg,subs,prog])if(r.error)throw r.error;
 if(g.data.archived_at){D.group=null;return}
 D.group=g.data;D.asg=asg.data;D.subs=subs.data;D.prog=new Map(prog.data.map(p=>[p.word_id,p]));
 if(!U._chInit){const c0=D.chapters.find(x=>x.book===curBook());if(c0)U.ch=c0.id;U._chInit=true}
 const ids=mem.data.map(x=>x.student_id);const p=await sb.from('profiles').select('id,full_name,xp,streak,last_active').in('id',ids);if(p.error)throw p.error;D.members=p.data;
 try{const dl=await sb.from('daily_log').select('*').eq('student_id',D.user.id).gte('day',dstr(14));D.dlog=dl.error?[]:dl.data}catch(e){D.dlog=[]}
 await loadV2(gid)}

 {const q=await sb.from('grammar_questions').select('*').order('chapter_id').order('sort').order('id');D.gq=q.error?[]:q.data}
 D.gdl=[];D.gtl=[];D.exams=[];D.att=[];

 {const vg=visGroups(),cur=D.group&&D.groups.find(x=>x.id===D.group.id);if(cur&&(!vg.length||vg.find(x=>x.id===cur.id)))D.group=cur;else D.group=vg[0]||D.groups[0]}

 for(const r of [p,s,wp])if(r.error)throw r.error;D.members=p.data;D.subs=s.data;D.gprogAll=wp.data;D.gprog=scopedProg();

async function loadT2(ids,gid){D.gdl=[];D.gtl=[];D.exams=[];D.att=[];

  const [dl,tl,ex]=await Promise.all([ids.length?sb.from('daily_log').select('student_id,day,goal,accuracy,completed_at').in('student_id',ids).gte('day',since):{data:[]},ids.length?sb.from('training_log').select('*').in('student_id',ids).gte('day',since):{data:[]},sb.from('exams').select('*').eq('group_id',gid).order('created_at',{ascending:false})]);

let Q=null;
function pool(chId,ids){let ws=ids?D.words.filter(w=>ids.includes(w.id)):chId?chWords(chId):D.words;return ws}
function pickWords(ws,n){const p=ws.map(w=>({w,wt:1+(D.prog.get(w.id)?.mistakes||0)*2+(D.prog.get(w.id)?.known?0:1)}));const out=[];
 while(out.length<n&&p.length){let t=p.reduce((a,x)=>a+x.wt,0),r=Math.random()*t;let k=p.findIndex(x=>(r-=x.wt)<0);if(k<0)k=p.length-1;out.push(p[k].w);p.splice(k,1)}return out}
const opts=(w,ws,key)=>shuf([w,...shuf(ws.filter(x=>x.id!==w.id&&x[key]!==w[key])).slice(0,3)]);
function makeQ(type,n,chId,ids,les){const base=pool(chId,ids);let ws=les?base.filter(w=>LN(w)===les):base;const dp=ws.length>=4?ws:base.length>=4?base:D.words;if(!ws.length)ws=base.length?base:D.words;
 if(type==='build'){const ls=(chId?chLines(chId):D.lines).filter(l=>!les||LN(l)===les).filter((l,i,a)=>a.findIndex(x=>x.ar===l.ar)===i&&l.ar.trim().split(/\s+/).length>1);
  if(ls.length){const all=D.lines.flatMap(x=>x.ar.trim().split(/\s+/));return shuf(ls).slice(0,n).map(l=>{const t=l.ar.trim().split(/\s+/);const extra=shuf(all.filter(w=>!t.includes(w))).slice(0,2);return {k:'build',l,t,tiles:shuf([...t,...extra])}})}
  type='mix'}
 const ks=['ar2ru','ru2ar','listen'];return pickWords(ws,n).map((w,j)=>{const k=type==='mix'?ks[j%3]:type;return {k,w,o:opts(w,dp,k==='ar2ru'?'ru':'ar')}})}
function startQuiz(type,n,chId,asgId,les){if(D.words.length<4){toast('Слишком мало слов для теста');return}
 Q={list:makeQ(type,n,chId,null,les),at:0,ok:0,bad:[],asgId,ans:null,built:[],pick:null};$('ov').classList.add('show');drawQ();if(Q.list[0].k==='listen')setTimeout(()=>say(Q.list[0].w),300)}
function drawQ(){const q=Q.list[Q.at];let body='';
 if(q.k==='ar2ru')body=`<div class="qask">Выберите перевод</div><div class="ar qbig">${A(q.w.ar)}</div><div class="opts">${q.o.map(x=>`<button class="opt" data-o="${x.id}">${esc(x.ru)}</button>`).join('')}</div>`;
 if(q.k==='ru2ar')body=`<div class="qask">Как это по-арабски?</div><div class="qru">${esc(q.w.ru)}</div><div class="opts">${q.o.map(x=>`<button class="opt ar" data-o="${x.id}">${A(x.ar)}</button>`).join('')}</div>`;
 if(q.k==='listen')body=`<div class="qask">Послушайте и выберите слово</div><div style="text-align:center;margin:10px 0 20px"><button class="play" style="width:96px;height:96px;margin:auto" data-say="w:${q.w.id}" aria-label="Слушать"><svg viewBox="0 0 24 24" fill="currentColor" style="width:40px;height:40px"><path d="M8 5v14l11-7z"/></svg></button></div><div class="opts">${q.o.map(x=>`<button class="opt ar" data-o="${x.id}">${A(x.ar)}</button>`).join('')}</div>`;
 if(q.k==='build')body=`<div class="qask">Соберите фразу по-арабски</div><div class="qru">${esc(q.l.ru)}</div><div class="built">${Q.built.map((ti,p)=>`<button class="tile" data-un="${p}">${A(q.tiles[ti])}</button>`).join('')}</div><div class="tiles">${q.tiles.map((t,ti)=>`<button class="tile ${Q.built.includes(ti)?'used':''}" data-ti="${ti}">${A(t)}</button>`).join('')}</div>`;
 let fb='';if(Q.ans!=null){const right=q.k==='build'?q.l.ar:q.k==='ar2ru'?q.w.ru:q.w.ar;
  fb=`<div class="fbbox ${Q.ans?'g':'w'}">${Q.ans?(Q.daily||Q.gold?'Верно!':'Верно! +10 очков'):'Правильный ответ:'} ${Q.ans?'':(q.k==='ar2ru'?`<div>${esc(right)}</div>`:`<div class="ar">${A(right)}</div>`)}</div>${Q.ans&&Q.daily?.rate&&!q.rq?rateBtns():`<button class="btn" style="width:100%" data-act="next">${Q.at+1<Q.list.length?'Дальше':'Завершить'}</button>`}`}
 else if(q.k==='build')fb=`<button class="btn" style="width:100%" data-act="check" ${Q.built.length?'':'disabled'}>Проверить</button>`;
 $('ov').innerHTML=`<div class="qz"><div class="qtop"><button class="x" data-act="close" aria-label="Закрыть">×</button><div class="prog"><i style="width:${Q.at/Q.list.length*100}%"></i></div>${Q.daily?`<span class="small mut">${Q.daily.solo?'':Q.daily.n+'/'+Q.daily.tot+' · '}${Q.daily.title}</span>`:Q.gold?'<span class="small mut">Проверка урока</span>':''}</div>${body}<div class="fb">${fb}</div></div>`;
 if(Q.ans!=null&&q.k!=='build')document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.o===q.w.id)b.classList.add('good');else if(+b.dataset.o===Q.pick)b.classList.add('wrong')})}
function answer(good){const q=Q.list[Q.at];Q.ans=good;if(good)Q.ok++;else Q.bad.push(q);
 if(Q.daily){if(!q.rq)Q.res.set(q.w.id,good);if(!good&&(q.rq||0)<2)Q.list.push({...q,o:shuf(q.o),rq:(q.rq||0)+1})}
 drawQ();if(q.k==='build')say({ar:q.l.ar,audio_url:q.l.audio_url});else if(q.k==='ar2ru')say(q.w)}
async function finish(){if(Q&&Q.gold){await goldDone(Q);return}
 if(Q&&Q.quick&&!isT()){await quickDone(Q);return}
 if(Q&&Q.daily&&Q.daily.train){await trainDone(Q);return}
 if(Q&&Q.daily){await dsQuizDone(Q);return}
 const n=Q.list.length,sc=Math.round(Q.ok/n*100),xp=Q.ok*10+(sc===100?20:0);const asgId=Q.asgId,bad=Q.bad;
 $('ov').innerHTML=`<div class="qz"><div class="loading">Сохраняем результат…</div></div>`;
 let sent=false;
 try{
  if(!isT()){
   const r=await sb.rpc('add_xp',{amount:Math.min(xp,200)});if(r.error)throw r.error;
   const badW=[...new Set(bad.filter(q=>q.w).map(q=>q.w.id))];
   if(badW.length){const rows=badW.map(id=>{const p=D.prog.get(id)||{};return {student_id:D.user.id,word_id:id,known:!!p.known,mistakes:(p.mistakes||0)+1,updated_at:new Date().toISOString()}});
    const u=await sb.from('word_progress').upsert(rows);if(u.error)throw u.error;rows.forEach(r=>D.prog.set(r.word_id,{...(D.prog.get(r.word_id)||{}),...r}))}
   if(asgId){const s=await sb.from('submissions').insert({assignment_id:asgId,student_id:D.user.id,score:sc,answers:{bad:badW,total:n}}).select().single();if(s.error)throw s.error;D.subs.push(s.data);sent=true}
   await loadMe();const m=D.members.find(x=>x.id===D.me.id);if(m)Object.assign(m,{xp:D.me.xp,streak:D.me.streak,last_active:D.me.last_active})}
 }catch(e){fail(e)}
 $('ov').innerHTML=`<div class="qz"><div class="res"><div class="mut" style="font-weight:700">${sc>=90?'Отличная работа!':sc>=60?'Хороший результат':'Стоит повторить'}</div><div class="score">${sc}%</div><p>${Q.ok} из ${n} верно${isT()?'':` · <b>+${xp} очков</b>`}${sc===100&&!isT()?' (бонус за 100%)':''}</p>${sent?'<p><span class="tag ok">Результат отправлен учителю</span></p>':''}</div>
 ${bad.length?`<h2>Повторить</h2><div class="list">${bad.map(q=>q.k==='build'?`<div class="item"><span class="grow">${esc(q.l.ru)}</span><span class="ar wrd">${A(q.l.ar)}</span></div>`:`<div class="item"><button class="play" data-say="w:${q.w.id}">${PLAY}</button><span class="grow">${esc(q.w.ru)}</span><span class="ar wrd">${A(q.w.ar)}</span></div>`).join('')}</div>`:''}
 <div class="fb"><button class="btn" style="width:100%" data-act="close">Готово</button></div></div>`}

function startCards(chId,les){const ws=(chId?chWords(chId):D.words).filter(w=>!les||LN(w)===les);if(!ws.length){toast('Слов пока нет');return}
 const un=ws.filter(w=>!D.prog.get(w.id)?.known),kn=ws.filter(w=>D.prog.get(w.id)?.known);

 <div class="row" style="margin-top:14px;justify-content:center"><button class="chip ${F.dir==='ar'?'on':''}" data-dir="ar">Арабский → русский</button><button class="chip ${F.dir==='ru'?'on':''}" data-dir="ru">Русский → арабский</button></div>
 <div class="flash ${F.fl?'fl':''}" id="fc" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="fcin"><div class="face">${front}</div><div class="face bk">${back}</div></div></div>
 <p class="mut small" style="text-align:center;margin-top:-8px">Нажмите на карточку, чтобы перевернуть</p>
 <div class="fb row" style="justify-content:center"><button class="play" data-say="w:${w.id}" aria-label="Слушать">${PLAY}</button><button class="btn alt" data-fc="0" style="flex:1">Повторить</button><button class="btn" data-fc="1" style="flex:1">Знаю</button></div></div>`}
async function setKnown(id,known){const p=D.prog.get(id)||{};const row={student_id:D.user.id,word_id:id,known,mistakes:p.mistakes||0,updated_at:new Date().toISOString()};D.prog.set(id,{...p,...row});

async function uploadAudio(key,blob){const [t,id]=key.split(':');const ext=(blob.type.includes('mp4')||blob.type.includes('m4a'))?'m4a':blob.type.includes('mpeg')?'mp3':blob.type.includes('ogg')?'ogg':blob.type.includes('wav')?'wav':'webm';
 const path=`${t==='w'?'words':t==='l'?'lines':'chapters'}/${id}-${Date.now()}.${ext}`;
 const up=await sb.storage.from('audio').upload(path,blob,{contentType:blob.type||'audio/mpeg',upsert:false});if(up.error)throw up.error;
 const url=sb.storage.from('audio').getPublicUrl(path).data.publicUrl;
 const tbl=t==='w'?'words':t==='l'?'dialog_lines':'chapters',col=t==='c'?'dialog_audio':'audio_url';
 const r=await sb.from(tbl).update({[col]:url}).eq('id',+id);if(r.error)throw r.error;
 const arr=t==='w'?D.words:t==='l'?D.lines:D.chapters;const o=arr.find(x=>x.id===+id);if(o)o[col]=url;toast('Аудио сохранено');render()}
let REC=null;
async function toggleRec(btn,key){
 if(REC){REC.mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];
  mr.ondataavailable=e=>ch.push(e.data);mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:mr.mimeType||'audio/webm'});REC=null;try{await uploadAudio(key,b)}catch(e){fail(e);render()}};
  REC={mr};mr.start();btn.classList.add('rec');btn.textContent='■ Стоп'}catch(e){toast('Нет доступа к микрофону')}}

async function saveRows(sel,tbl,arr){const rows=[...document.querySelectorAll(sel)].map(tr=>{const id=+tr.dataset[sel==='tr[data-w]'?'w':'l'];const o={id};tr.querySelectorAll('[data-f]').forEach(i=>{o[i.dataset.f]=i.value.trim()||null});return o});
 for(const o of rows){if(!o.ar||!o.ru){toast('У каждой строки должны быть арабский текст и перевод');return}}
 for(const o of rows){const {id,...rest}=o;const r=await sb.from(tbl).update(rest).eq('id',id);if(r.error)return fail(r.error);Object.assign(arr.find(x=>x.id===id),rest)}
 toast('Сохранено');render()}

/* ===== ежедневная норма новых слов ===== */
const GOALS=[[3,'Начальный',6],[5,'Базовый',9],[7,'Продвинутый',12],[10,'Интенсивный',17]];
const REVCAP={3:5,5:7,7:10,10:10};
const DSN={intro:'Знакомство',speak:'Произношение',practice:'Практика',review:'Повторение',final:'Итоговая проверка'};
const pl=(n,f)=>{const a=n%10,b=n%100;return a===1&&b!==11?f[0]:(a>=2&&a<=4&&(b<10||b>=20))?f[1]:f[2]};
const dur=d=>{const m=Math.round(d/30);return d<60?`${d} ${pl(d,['день','дня','дней'])}`:m<24?`${m} мес.`:`${(m/12).toFixed(1).replace('.',',')} года`};
const goalOf=()=>D.me?.daily_goal||0;
const dayRow=()=>(D.dlog||[]).find(r=>r.day===today())||null;
const byIds=ids=>ids.map(id=>D.words.find(w=>w.id===id)).filter(Boolean);
const wkey=w=>w.ar+'|'+w.ru;
const taken=id=>{const p=D.prog.get(id);return !!p&&(p.stage>0||p.known)};
const SEC={male:'Мужской класс',female:'Женский класс'};
const visGroups=()=>!U.sec||U.sec==='all'?D.groups:D.groups.filter(x=>x.section===U.sec);
const secChips=()=>`<div class="row" style="gap:8px;margin:0 0 14px;flex-wrap:wrap">${[['all','Все'],['male',SEC.male],['female',SEC.female]].map(([k,l])=>`<button class="chip ${(U.sec||'all')===k?'on':''}" data-act="z_sec" data-id="${k}" aria-pressed="${(U.sec||'all')===k}">${l}</button>`).join('')}</div>`;
const curBook=()=>D.group?.current_book||1;
function scopedProg(){const b=curBook(),cb=new Map(D.chapters.map(c=>[c.id,c.book])),wb=new Map(D.words.map(w=>[w.id,cb.get(w.chapter_id)]));return (D.gprogAll||[]).filter(p=>(wb.get(p.word_id)||1)>=b)}
const chaptersFrom=()=>{const b=curBook();return [...D.chapters.filter(c=>c.book>=b),...D.chapters.filter(c=>c.book<b)]};
function ordered(){const b=curBook();if(D._ord&&D._ordN===D.words.length&&D._ordB===b)return D._ord;const r=[];for(const c of chaptersFrom())r.push(...chWords(c.id));D._ord=r.filter(w=>w.ar&&w.ar!=='—');D._ordN=D.words.length;D._ordB=b;return D._ord}
function takenKeys(){const s=new Set();for(const w of D.words)if(taken(w.id))s.add(wkey(w));return s}
function pickNew(n,skip){const ex=new Set(skip||[]),tk=takenKeys(),out=[];for(const w of ordered()){if(out.length>=n)break;if(ex.has(w.id)||taken(w.id))continue;const k=wkey(w);if(tk.has(k))continue;tk.add(k);out.push(w)}return out}
function remaining(){const tk=takenKeys(),s=new Set();for(const w of ordered())if(!taken(w.id)&&!tk.has(wkey(w)))s.add(wkey(w));return s.size}
function dueReview(cap){const t=today();return D.words.filter(w=>{const p=D.prog.get(w.id);return p&&p.stage>0&&p.next_review&&p.next_review<=t}).sort((a,b)=>{const x=D.prog.get(a.id),y=D.prog.get(b.id);return (x.next_review<y.next_review?-1:x.next_review>y.next_review?1:0)||((y.mistakes||0)-(x.mistakes||0))}).slice(0,cap)}
const dsList=c=>{const a=[];if(c.new_ids.length)a.push('intro','speak','practice');if(c.review_ids.length)a.push('review');if(c.new_ids.length)a.push('final');return a};
const dpOf=w=>{const ch=chWords(w.chapter_id);return ch.length>=4?ch:D.words};
const qFor=(k,w)=>({k,w,o:opts(w,dpOf(w),k==='ar2ru'?'ru':'ar')});
const aud=w=>!!w.audio_url;

function lvlPick(cur){const left=remaining();
 return `<div class="card dn"><span class="tag">Ежедневная норма</span><h3 style="margin-top:8px">Сколько новых слов в день?</h3>
 <p class="mut small" style="margin:0 0 12px">Выберите уровень, который вам по силам. Его можно сменить в любое время.</p>
 <div class="lvls">${GOALS.map(([g,n,m])=>`<button class="lv ${cur===g?'on':''}" data-act="d_goal" data-g="${g}"><b>${n}</b><span>${g} ${pl(g,['слово','слова','слов'])} в день</span><span class="mut">около ${m} мин в день · весь учебник за ${dur(Math.ceil(left/g))}</span></button>`).join('')}</div>
 ${cur?'<button class="chip" data-act="d_chg" style="margin-top:12px">Отмена</button>':''}</div>`}

function normCard(){if(isT())return '';
 const g=goalOf(),row=dayRow();if(!g||U.chLvl)return lvlPick(g);
 const lrn=[...D.prog.values()].filter(p=>p.stage>=3||p.known).length,due=dueReview(999).length,lv=GOALS.find(x=>x[0]===g)[1];
 const head=`<div class="row" style="justify-content:space-between"><span class="tag">${lv} · ${g} ${pl(g,['слово','слова','слов'])} в день</span><button class="chip" data-act="d_chg" style="min-height:32px;padding:4px 12px;font-size:13px">Изменить уровень</button></div>`;
 const info=`<p class="mut small" style="margin:10px 0 0">Всего выучено: <b>${lrn}</b> из ${D.words.length} · на повторение сегодня: <b>${due}</b></p>`;
 if(row?.completed_at){const left=remaining();
  return `<div class="card dn">${head}<div class="row" style="margin-top:12px"><span class="tag ok">Норма на сегодня выполнена</span></div><h3 style="margin-top:8px">Новых слов: ${row.new_ids.length} · повторено: ${row.review_ids.length}${row.accuracy!=null?` · точность ${row.accuracy}%`:''}</h3>${info}
  ${left?`<div class="row" style="margin-top:12px"><button class="btn alt" data-act="d_extra">Ещё 3 слова</button></div>`:''}</div>`}
 let nNew,nRev,steps;
 if(row){nNew=row.new_ids.length;nRev=row.review_ids.length;steps=dsList(row).map(k=>[k,!!row.steps[k]])}
 else{nNew=pickNew(g).length;nRev=dueReview(REVCAP[g]).length;steps=dsList({new_ids:Array(nNew),review_ids:Array(nRev)}).map(k=>[k,false])}
 if(!nNew&&!nRev)return `<div class="card dn">${head}<h3 style="margin-top:12px">Все слова учебника пройдены</h3><p class="mut small">Новых слов больше нет, и повторять пока нечего. Возвращайтесь завтра.</p></div>`;
 const done=steps.filter(s=>s[1]).length,C=2*Math.PI*34;
 return `<div class="card dn">${head}
 <div class="hd" style="margin-top:14px"><div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*done/steps.length} ${C}"/></svg><b>${done}/${steps.length}</b></div>
 <div><h3 style="margin:0 0 2px">Сегодня: ${nNew} ${pl(nNew,['новое слово','новых слова','новых слов'])}${nRev?` и ${nRev} на повторение`:''}</h3><p class="mut small" style="margin:0">Пройдите все шаги, и норма будет выполнена.</p></div></div>
 <div class="dsl">${steps.map(([k,ok])=>`<div class="${ok?'ok':''}"><i>${ok?'✓':''}</i>${DSN[k]}</div>`).join('')}</div>
 <button class="btn" style="width:100%" data-act="d_start">${done?'Продолжить':'Начать'}</button>${info}</div>`}

/* --- сессия --- */
let DS=null,DREC=null;
const setRow=r=>{D.dlog=(D.dlog||[]).filter(x=>x.day!==r.day);D.dlog.push(r);if(DS)DS.c=r};
async function dsReloadProg(){const r=await sb.from('word_progress').select('*').eq('student_id',D.user.id);if(!r.error)D.prog=new Map(r.data.map(p=>[p.word_id,p]))}
async function dsMark(k){if(DS.c.extra){DS.c.steps[k]=true;return}const r=await sb.rpc('day_step',{p_step:k});if(r.error)throw r.error;setRow(r.data)}
async function dsOpen(extra){
 try{let c;
  if(extra){const nw=pickNew(3,dayRow()?.new_ids);if(!nw.length){toast('Новых слов больше нет');return}c={extra:true,new_ids:nw.map(w=>w.id),review_ids:[],steps:{}}}
  else{let row=dayRow();
   if(!row){const g=goalOf(),nw=pickNew(g).map(w=>w.id),rv=dueReview(REVCAP[g]).map(w=>w.id);if(!nw.length&&!rv.length){toast('На сегодня слов нет');return}

function trainPick(){if(!D.prog)return [];const t=today(),row=dayRow(),inRev=new Set(row?.review_ids||[]),out=[],seen=new Set(),P=id=>D.prog.get(id);
 const add=w=>{if(out.length>=10||seen.has(w.id))return;seen.add(w.id);out.push(w)};
 const fresh=D.words.filter(w=>{const p=P(w.id);return p&&p.stage>0&&p.first_seen===t&&p.learned_at&&Date.now()-Date.parse(p.learned_at)>=4*36e5});
 shuf(fresh).slice(0,6).forEach(add);
 const notToday=p=>!p.updated_at||localDay(p.updated_at)!==t;
 D.words.filter(w=>{const p=P(w.id);return p&&p.stage>0&&p.next_review&&p.next_review<=t&&!inRev.has(w.id)&&notToday(p)}).sort((a,b)=>(P(b.id).mistakes||0)-(P(a.id).mistakes||0)).forEach(add);
 shuf(D.words.filter(w=>{const p=P(w.id);return p&&p.stage>0&&(p.mistakes||0)>=2&&notToday(p)})).forEach(add);
 return out}

function zExamIntro(e){$('ov').classList.add('show');$('ov').innerHTML=`<div class="qz"><div class="res"><h1 style="margin:0 0 10px">${esc(e.title)}</h1><p class="mut">Три части: слова, понимание диалога и грамматика.<br>Время: <b>${e.time_limit_min} мин</b>. Попытка одна.<br>Подсказок нет, правильные ответы не показываются. Результат увидит только учитель, очки не начисляются.</p></div><div class="fb"><button class="btn" style="width:100%" data-act="z_exam_go" data-id="${e.id}">Начать</button><button class="btn alt" style="width:100%;margin-top:10px" data-act="close">Не сейчас</button></div></div>`}
function examPayload(e){const set=new Set(e.chapter_ids),seen=new Set();
 const ws=D.words.filter(w=>set.has(w.chapter_id)&&w.ar&&w.ar!=='—'&&w.ru&&w.ru!=='—').filter(w=>{const k=wkey(w);if(seen.has(k))return false;seen.add(k);return true});
 const words=ws.length>=4?shuf(ws).slice(0,e.n_words).map((w,i)=>{const k=i%2?'ru2ar':'ar2ru';return {k,w:w.id,o:opts(w,ws,k==='ar2ru'?'ru':'ar').map(x=>x.id)}}):[];
 const ls=[...new Map(D.lines.filter(l=>set.has(l.chapter_id)&&l.ru&&l.ru!=='—'&&l.ar.trim().split(/\s+/).length>=2).map(l=>[l.ru,l])).values()];
 const dialog=ls.length>=4?shuf(ls).slice(0,e.n_dialog).map(l=>{const same=shuf(ls.filter(x=>x.id!==l.id&&x.chapter_id===l.chapter_id)).slice(0,3);const rest=same.length<3?shuf(ls.filter(x=>x.id!==l.id&&!same.includes(x))).slice(0,3-same.length):[];return {l:l.id,o:shuf([l,...same,...rest]).map(x=>x.id)}}):[];
 return {n_words:words.length,n_dialog:dialog.length,words,dialog}}
async function zExamGo(id){const e=D.exams.find(x=>x.id===id);if(!e)return;
 $('ov').classList.add('show');$('ov').innerHTML='<div class="qz"><div class="loading">Готовим экзамен…</div></div>';
 try{const r=await sb.rpc('exam_start',{p_exam:id,p_payload:examPayload(e)});if(r.error)throw r.error;const s=r.data,pay=s.payload||{};
  D.exst.set(id,{exam_id:id,started:true,finished:false});
  const qs=[];(pay.words||[]).forEach(q=>qs.push({t:'w',k:q.k,w:q.w,o:q.o}));(pay.dialog||[]).forEach(q=>qs.push({t:'d',l:q.l,o:q.o}));(s.grammar||[]).forEach(q=>qs.push({t:'g',id:q.id,q:q.q,o:q.o}));
  if(!qs.length){toast('В экзамене нет вопросов. Сообщите учителю');$('ov').classList.remove('show');$('ov').innerHTML='';return}
  E={e,qs,at:0,ans:qs.map(()=>null),end:Date.parse(s.started_at)+s.limit_min*6e4};
  zExamDraw();clearInterval(ETM);ETM=setInterval(zExamTick,1000)
 }catch(err){fail(err);$('ov').classList.remove('show');$('ov').innerHTML='';E=null;render()}}
function zExamDraw(){const q=E.qs[E.at],n=E.qs.length,a=E.ans[E.at];let body='';const sel=v=>a===v?' sel':'';
 if(q.t==='w'){const w=D.words.find(x=>x.id===q.w),op=q.o.map(id=>D.words.find(x=>x.id===id)).filter(Boolean);
  body=q.k==='ar2ru'?`<div class="qask">Выберите перевод</div><div class="ar qbig">${A(w.ar)}</div><div class="opts">${op.map(x=>`<button class="opt${sel(x.id)}" data-zo="${x.id}">${esc(x.ru)}</button>`).join('')}</div>`
   :`<div class="qask">Как это по-арабски?</div><div class="qru">${esc(w.ru)}</div><div class="opts">${op.map(x=>`<button class="opt ar${sel(x.id)}" data-zo="${x.id}">${A(x.ar)}</button>`).join('')}</div>`}
 else if(q.t==='d'){const l=D.lines.find(x=>x.id===q.l),op=q.o.map(id=>D.lines.find(x=>x.id===id)).filter(Boolean);
  body=`<div class="qask">Что значит эта фраза из диалога?</div><div class="ar qbig" style="font-size:30px">${A(l.ar)}</div><div class="opts">${op.map(x=>`<button class="opt${sel(x.id)}" data-zo="${x.id}">${esc(x.ru)}</button>`).join('')}</div>`}
 else body=`<div class="qask">Грамматика</div><div class="qru" style="font-size:22px">${esc(q.q)}</div><div class="opts">${q.o.map(x=>`<button class="opt${sel(x.i)}" data-zo="${x.i}">${hasAr(x.t)?`<span class="ar">${esc(x.t)}</span>`:esc(x.t)}</button>`).join('')}</div>`;
 const part=q.t==='w'?'Слова':q.t==='d'?'Диалог':'Грамматика';
 $('ov').innerHTML=`<div class="qz"><div class="qtop"><div class="prog"><i style="width:${E.at/n*100}%"></i></div><span class="small mut">${E.at+1}/${n} · ${part} · <b id="etm"></b></span></div>${body}<div class="fb"><button class="btn" style="width:100%" data-act="z_exam_next" ${a==null?'disabled':''}>${E.at+1<n?'Дальше':'Сдать экзамен'}</button></div></div>`;zExamTick()}
function zExamTick(){if(!E)return;const left=Math.max(0,E.end-Date.now()),m=Math.floor(left/6e4),s=Math.floor(left%6e4/1000),el=$('etm');if(el)el.textContent=`${m}:${String(s).padStart(2,'0')}`;
 if(left<=0&&!E.sending){E.sending=true;zExamSubmit(true)}}
async function zExamSubmit(timeout){if(!E)return;clearInterval(ETM);ETM=null;E.sending=true;
 $('ov').innerHTML='<div class="qz"><div class="loading">Отправляем ответы…</div></div>';
 let wok=0,dok=0;const g={};
 E.qs.forEach((q,i)=>{const a=E.ans[i];if(q.t==='w'){if(a===q.w)wok++}else if(q.t==='d'){if(a===q.l)dok++}else if(a!=null)g[q.id]=a});
 const id=E.e.id;
 try{const r=await sb.rpc('exam_submit',{p_exam:id,p_answers:{g},p_words_ok:wok,p_dialog_ok:dok});if(r.error)throw r.error;
  D.exst.set(id,{exam_id:id,started:true,finished:true});E=null;
  $('ov').innerHTML=`<div class="qz"><div class="res"><div class="chk"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1 style="margin:0 0 6px">Экзамен сдан</h1><p class="mut" style="margin:0">${timeout?'Время вышло, ответы отправлены. ':''}Результат увидит учитель.</p></div><div class="fb"><button class="btn" style="width:100%" data-act="close">Готово</button></div></div>`
 }catch(err){fail(err);ZRETRY=()=>zExamSubmit(timeout);$('ov').innerHTML=`<div class="qz"><div class="res"><p>Не удалось отправить ответы. Проверьте интернет и нажмите «Повторить». Ответы сохранены на этом экране.</p></div><div class="fb"><button class="btn" style="width:100%" data-act="z_retry">Повторить</button></div></div>`}}

/* --- экзамен: учитель --- */
function examTeacher(){if(!D.group)return V.group();
 if(U.openEx){const e=D.exams.find(x=>x.id===U.openEx);if(e)return examResults(e)}
 const books=[...new Set(D.chapters.map(c=>c.book))],now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4),f=d=>new Date(d.getTime()).toISOString().slice(0,16);

 return `<h1>Экзамены · ${esc(D.group.name)}</h1><p class="mut">Раз в месяц: слова, понимание диалога и грамматика. Без подсказок, одна попытка, результат видите только вы. Очки и повторение слов экзамен не затрагивает.</p>
 <div class="list" style="margin:14px 0">${D.exams.length?D.exams.map(e=>{const fin=D.att.filter(a=>a.exam_id===e.id&&a.finished_at).length;return `<button class="item" data-act="z_exopen" data-id="${e.id}" style="text-align:start;width:100%"><div class="grow"><b>${esc(e.title)}</b><div class="small mut">${dt(e.opens_at)} — ${dt(e.closes_at)} · ${e.time_limit_min} мин</div></div><span class="tag ${fin&&fin>=D.members.length?'ok':''}">сдали ${fin} из ${D.members.length}</span></button>`}).join(''):'<p class="mut">Экзаменов пока нет.</p>'}</div>
 <h2>Новый экзамен</h2><form class="form card" id="f-exam">
 <div><label for="ex-t">Название</label><input type="text" id="ex-t" required value="Экзамен, ${esc(mon)}"></div>
 <div><label>Какие главы входят в экзамен</label><p class="mut small" style="margin:0 0 6px">В скобках: слов · вопросов по грамматике (из них проверенных).</p>
 ${books.map(b=>`<details style="margin:6px 0"><summary style="font-weight:700;cursor:pointer">Том ${b}</summary><label class="row" style="gap:8px;margin:8px 0"><input type="checkbox" data-bookall="${b}"> весь том</label>${D.chapters.filter(c=>c.book===b).map(c=>{const q=D.gq.filter(x=>x.chapter_id===c.id);return `<label class="row" style="gap:8px;margin:6px 0"><input type="checkbox" name="ex-ch" data-b="${b}" value="${c.id}"> <span>Глава ${c.number} — ${esc(c.title)} <span class="mut small">(${chWords(c.id).length} · ${q.length} (${q.filter(x=>x.reviewed).length}))</span></span></label>`}).join('')}</details>`).join('')}</div>
 <div class="row"><div style="flex:1"><label for="ex-w">Слов</label><input type="number" id="ex-w" min="0" max="40" value="15"></div><div style="flex:1"><label for="ex-d">Реплик диалога</label><input type="number" id="ex-d" min="0" max="30" value="8"></div><div style="flex:1"><label for="ex-g">Вопросов по грамматике</label><input type="number" id="ex-g" min="0" max="40" value="10"></div><div style="flex:1"><label for="ex-m">Минут</label><input type="number" id="ex-m" min="5" max="180" value="30"></div></div>
 <div class="row"><div style="flex:1;min-width:200px"><label for="ex-o">Открывается</label><input type="datetime-local" id="ex-o" value="${f(now)}"></div><div style="flex:1;min-width:200px"><label for="ex-c">Закрывается</label><input type="datetime-local" id="ex-c" value="${f(new Date(now.getTime()+2*864e5))}"></div></div>
 <label class="row" style="gap:8px"><input type="checkbox" id="ex-u"> <span>Включать вопросы по грамматике, которые я ещё не проверил</span></label>
 <button class="btn">Создать экзамен</button></form>`}
async function zExamCreate(f){const ids=[...f.querySelectorAll('input[name=ex-ch]:checked')].map(i=>+i.value);
 if(!ids.length){toast('Выберите хотя бы одну главу');return}
 const num=(id,lo,hi)=>Math.min(hi,Math.max(lo,Math.round(+f.querySelector(id).value||0))),unr=f.querySelector('#ex-u').checked;
 const nW=num('#ex-w',0,40),nD=num('#ex-d',0,30),nG=num('#ex-g',0,40),tm=num('#ex-m',5,180);
 if(nW+nD+nG===0){toast('Добавьте хотя бы один вопрос');return}
 const o=new Date(f.querySelector('#ex-o').value),c=new Date(f.querySelector('#ex-c').value);
 if(isNaN(o)||isNaN(c)||c<=o){toast('Проверьте даты: закрытие должно быть позже открытия');return}
 const avail=D.gq.filter(q=>ids.includes(q.chapter_id)&&(q.reviewed||unr)).length;
 if(nG>avail){toast(`Вопросов по грамматике в выбранных главах: ${avail}, а нужно ${nG}. Отметьте вопросы проверенными в разделе «Материал» или включите непроверенные`);return}
 const r=await sb.from('exams').insert({group_id:D.group.id,title:f.querySelector('#ex-t').value.trim()||'Экзамен',chapter_ids:ids,n_words:nW,n_dialog:nD,n_grammar:nG,time_limit_min:tm,opens_at:o.toISOString(),closes_at:c.toISOString(),include_unreviewed:unr}).select().single();
 if(r.error)throw r.error;D.exams.unshift(r.data);toast('Экзамен создан');render()}
function examResults(e){const at=D.att.filter(a=>a.exam_id===e.id),by=new Map(at.map(a=>[a.student_id,a])),pc=(a,b)=>b?Math.round(a*100/b)+'%':'—';
 const rows=D.members.slice().sort((a,b)=>a.full_name.localeCompare(b.full_name)).map(m=>{const a=by.get(m.id);
  if(!a)return `<tr><td>${esc(m.full_name)}</td><td colspan="5"><span class="tag late">не начал(а)</span></td></tr>`;
  if(!a.finished_at)return `<tr><td>${esc(m.full_name)}</td><td colspan="5"><span class="tag">в процессе</span></td></tr>`;
  const ok=a.words_ok+a.dialog_ok+a.grammar_ok,n=a.words_n+a.dialog_n+a.grammar_n,mins=Math.max(1,Math.round((Date.parse(a.finished_at)-Date.parse(a.started_at))/6e4));
  return `<tr><td>${esc(m.full_name)}</td><td class="n">${a.words_ok}/${a.words_n}</td><td class="n">${a.dialog_ok}/${a.dialog_n}</td><td class="n">${a.grammar_ok}/${a.grammar_n}</td><td class="n"><b>${pc(ok,n)}</b></td><td class="n hide-s">${mins} мин${a.late?' · после времени':''}</td></tr>`}).join('');
 const miss=new Map(),tot=new Map();
 for(const a of at.filter(a=>a.finished_at))for(const qid of a.grammar_ids){const q=D.gq.find(x=>x.id===qid);if(!q)continue;tot.set(qid,(tot.get(qid)||0)+1);const v=a.answers?.g?.[qid];if(v==null||+v!==q.correct)miss.set(qid,(miss.get(qid)||0)+1)}
 const top=[...miss].map(([id,c])=>({q:D.gq.find(x=>x.id===id),c,t:tot.get(id)})).filter(x=>x.q).sort((a,b)=>b.c-a.c).slice(0,8);
 return `<button class="chip" data-act="z_exback">← Все экзамены</button><h1 style="margin-top:14px">${esc(e.title)}</h1>
 <p class="mut">${dt(e.opens_at)} — ${dt(e.closes_at)} · ${e.time_limit_min} мин · глав: ${e.chapter_ids.length} · вопросов: слова ${e.n_words}, диалог ${e.n_dialog}, грамматика ${e.n_grammar}</p>
 <div class="scroll"><table><thead><tr><th>Ученик</th><th class="n">Слова</th><th class="n">Диалог</th><th class="n">Грамматика</th><th class="n">Итого</th><th class="n hide-s">Время</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="mut">В группе нет учеников</td></tr>'}</tbody></table></div>
 ${top.length?`<h2>Где ошибались в грамматике</h2><div class="list">${top.map(x=>`<div class="item"><div class="grow">${esc(x.q.question)}<div class="small mut">Верно: ${hasAr(x.q.options[x.q.correct])?`<span class="ar">${esc(x.q.options[x.q.correct])}</span>`:esc(x.q.options[x.q.correct])}</div></div><span class="tag late">${x.c} из ${x.t}</span></div>`).join('')}</div>`:''}
 <div class="row" style="margin-top:20px"><button class="btn del" data-act="z_exdel" data-id="${e.id}">Удалить экзамен</button></div>`}

 return `<h2>Вопросы по грамматике (${qs.length}, проверено ${rv})</h2><p class="mut small">Для ежемесячного экзамена. Ученики этих вопросов и ответов не видят. В экзамен попадают только проверенные вопросы (с галочкой), если при создании экзамена не включены непроверенные.</p>

 <div class="row"><div><label>Верный</label><select data-f="correct">${q.options.map((_,i)=>`<option value="${i}" ${q.correct===i?'selected':''}>${L[i]}</option>`).join('')}</select></div><div style="flex:1;min-width:200px"><label>Пояснение</label><input data-f="explanation" dir="auto" value="${esc(q.explanation)}"></div></div></div>`).join('')||'<p class="mut">Вопросов пока нет.</p>'}</div>
 <div class="row" style="margin-top:10px"><button class="btn" data-act="z_gqsave">Сохранить вопросы</button><button class="btn alt" data-act="z_gqadd">+ Вопрос</button>${qs.length?'<button class="btn alt" data-act="z_gqall">Отметить все проверенными</button>':''}</div>`}
async function gqSave(){const cards=[...document.querySelectorAll('[data-q]')];
 for(const el of cards){const id=+el.dataset.q,q=D.gq.find(x=>x.id===id);if(!q)continue;
  const get=f=>el.querySelector(`[data-f="${f}"]`),opts=[...el.querySelectorAll('[data-o]')].map(i=>i.value.trim()),question=get('question').value.trim();
  if(!question||opts.some(o=>!o)){toast('У каждого вопроса должны быть текст и все варианты ответа');return}
  const upd={question,options:opts,correct:+get('correct').value,explanation:get('explanation').value.trim()||null,reviewed:get('reviewed').checked,lesson:get('lesson').value.trim()?+get('lesson').value:null};
  if(JSON.stringify([q.question,q.options,q.correct,q.explanation,q.reviewed,q.lesson])===JSON.stringify([upd.question,upd.options,upd.correct,upd.explanation,upd.reviewed,upd.lesson]))continue;
  const r=await sb.from('grammar_questions').update(upd).eq('id',id);if(r.error)throw r.error;Object.assign(q,upd)}
 toast('Вопросы сохранены');render()}

/* --- статистика нормы (учитель) --- */
function normStats(){if(!D.group)return '';const t=today(),ms=D.members,dl=D.gdl||[],tl=D.gtl||[];
 const doneBy=new Map();for(const r of dl)if(r.completed_at){if(!doneBy.has(r.student_id))doneBy.set(r.student_id,new Set());doneBy.get(r.student_id).add(r.day)}
 const cnt=(id,n)=>{const s=doneBy.get(id);if(!s)return 0;let k=0;for(let i=0;i<n;i++)if(s.has(dstr(i)))k++;return k};
 const run=id=>{const s=doneBy.get(id);if(!s)return 0;let i=s.has(dstr(0))?0:1,k=0;while(s.has(dstr(i))){k++;i++}return k};
 const lrn=new Map(),due=new Map();for(const p of D.gprog){if(p.stage>=3||p.known)lrn.set(p.student_id,(lrn.get(p.student_id)||0)+1);if(p.stage>0&&p.next_review&&p.next_review<t)due.set(p.student_id,(due.get(p.student_id)||0)+1)}
 const acc=id=>{const a=dl.filter(r=>r.student_id===id&&r.completed_at&&r.accuracy!=null);return a.length?Math.round(a.reduce((s,r)=>s+r.accuracy,0)/a.length)+'%':'—'};
 const trn=id=>tl.filter(r=>r.student_id===id&&r.day>=dstr(6)).length;
 const last=id=>{const s=[...(doneBy.get(id)||[])].sort().pop();return s?fmt(s):'—'};
 const todayDone=ms.filter(m=>doneBy.get(m.id)?.has(t)).length,idle=ms.filter(m=>!doneBy.get(m.id)||![0,1,2].some(i=>doneBy.get(m.id).has(dstr(i)))).length;
 const rows=ms.slice().sort((a,b)=>cnt(b.id,7)-cnt(a.id,7)||a.full_name.localeCompare(b.full_name)).map(m=>`<tr><td>${esc(m.full_name)}</td><td class="n">${m.daily_goal||'—'}</td><td class="n">${cnt(m.id,7)}/7</td><td class="n hide-s">${cnt(m.id,30)}/30</td><td class="n hide-s">${run(m.id)}</td><td class="n">${lrn.get(m.id)||0}</td><td class="n hide-s">${due.get(m.id)||0}</td><td class="n hide-s">${acc(m.id)}</td><td class="n hide-s">${trn(m.id)}</td><td class="n hide-s">${last(m.id)}</td></tr>`).join('');
 return `<h1>Ежедневная норма · ${esc(D.group.name)}</h1><p class="mut">Кто занимается самостоятельно каждый день. Норма считается выполненной, когда пройдены все шаги дня.</p>
 <div class="grid" style="margin:14px 0"><div class="card"><div class="mut small">Выполнили норму сегодня</div><div style="font-size:34px;font-weight:800">${todayDone} из ${ms.length}</div></div><div class="card"><div class="mut small">Не выполняли норму 3 дня подряд</div><div style="font-size:34px;font-weight:800">${idle}</div></div></div>

/* --- быстрая тренировка: 10 слов, которые пора повторить --- */
function quickPick(){const t=today(),P=id=>D.prog?.get(id),out=[],seen=new Set();
 const add=w=>{if(out.length>=10||seen.has(w.id))return;seen.add(w.id);out.push(w)};
 D.words.filter(w=>{const p=P(w.id);return p&&p.stage>0&&p.next_review&&p.next_review<=t}).sort((a,b)=>P(a.id).next_review<P(b.id).next_review?-1:P(a.id).next_review>P(b.id).next_review?1:(P(b.id).mistakes||0)-(P(a.id).mistakes||0)).forEach(add);
 D.words.filter(w=>(P(w.id)?.mistakes||0)>0).sort((a,b)=>(P(b.id).mistakes||0)-(P(a.id).mistakes||0)).forEach(add);
 const r=recommend();if(r){shuf(chWords(r.c.id).filter(w=>LN(w)===r.les)).sort((a,b)=>(P(a.id)?.known?1:0)-(P(b.id)?.known?1:0)).forEach(add)}
 shuf(D.words.filter(w=>(P(w.id)?.stage||0)>0)).forEach(add);
 shuf(D.words).forEach(add);
 return out}
function startQuick(){if(D.words.length<4){toast('Слишком мало слов для теста');return}
 const ks=['ar2ru','ru2ar','listen'],ws=shuf(quickPick());
 Q={list:ws.map((w,j)=>({k:ks[j%3],w,o:opts(w,D.words,ks[j%3]==='ar2ru'?'ru':'ar')})),at:0,ok:0,bad:[],asgId:null,ans:null,built:[],pick:null,quick:true};
 $('ov').classList.add('show');drawQ();if(Q.list[0].k==='listen')setTimeout(()=>say(Q.list[0].w),300)}
async function quickDone(q){const n=q.list.length,sc=Math.round(q.ok/n*100),bad=q.bad;
 $('ov').innerHTML=`<div class="qz"><div class="loading">Сохраняем результат…</div></div>`;
 let xp=0,runs=1;
 try{const badIds=new Set(bad.filter(x=>x.w).map(x=>x.w.id));
  const items=q.list.filter(x=>x.w).map(x=>({id:x.w.id,ok:!badIds.has(x.w.id)}));
  const r=await sb.rpc('complete_quick',{items,p_ok:q.ok,p_n:n});if(r.error)throw r.error;xp=r.data.xp;runs=r.data.runs;
  await dsReloadProg();await loadMe();const m=D.members.find(x=>x.id===D.me.id);if(m)Object.assign(m,{xp:D.me.xp,streak:D.me.streak,last_active:D.me.last_active});
 }catch(e){fail(e)}
 $('ov').innerHTML=`<div class="qz"><div class="res"><div class="mut" style="font-weight:700">${sc>=90?'Отличная работа!':sc>=60?'Хороший результат':'Стоит повторить'}</div><div class="score">${sc}%</div><p>${q.ok} из ${n} верно${xp?` · <b>+${xp} очков</b>`:''}${sc===100&&xp>=20?' (бонус за 100%)':''}</p>${runs>3?'<p class="mut small">Очки даются за первые 3 тренировки в день, эта пройдена для практики.</p>':''}</div>
 ${bad.length?`<h2>Повторить</h2><div class="list">${bad.map(x=>`<div class="item"><button class="play" data-say="w:${x.w.id}">${PLAY}</button><span class="grow">${esc(x.w.ru)}</span><span class="ar wrd">${A(x.w.ar)}</span></div>`).join('')}</div>`:''}
 <div class="fb"><button class="btn" style="width:100%" data-act="close">Готово</button></div></div>`}

 else if(a==='z_gqdel'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Удалить?';return}

 else if(a==='z_gqall'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Вы проверили все? Нажмите ещё раз';return}

 if(f.id==='f-gren'){const nm=$('g-ren').value.trim();if(!nm){toast('Введите название');return}const r=await sb.from('groups').update({name:nm}).eq('id',D.group.id);if(r.error)throw r.error;D.group.name=nm;toast('Название изменено');await loadTeacher();render();return}
 if(f.id==='f-group'){const r=await sb.from('groups').insert({name:$('g-name').value.trim(),teacher_id:D.user.id,section:U.sec==='male'||U.sec==='female'?U.sec:null}).select().single();if(r.error)throw r.error;D.group=r.data;toast('Группа создана');await loadTeacher();render();return}
 if(f.id==='f-asg'){const ch=$('a-c').value;const r=await sb.from('assignments').insert({group_id:D.group.id,title:$('a-t').value.trim(),type:$('a-y').value,question_count:+$('a-n').value,chapter_id:ch?+ch:null,due_date:$('a-d').value||null});if(r.error)throw r.error;toast('Задание отправлено группе');await loadTeacher();render();return}
 if(f.id==='f-ch'){const c=D.chapters.find(x=>x.id===U.matCh);const upd={book:+$('c-b').value||1,number:+$('c-n').value||1,title:$('c-t').value.trim()||'Без названия',title_ar:$('c-ta').value.trim()||null,grammar:$('c-g').value.trim()||null};
  const r=await sb.from('chapters').update(upd).eq('id',c.id);if(r.error)throw r.error;Object.assign(c,upd);D.chapters.sort((a,b)=>a.book-b.book||a.number-b.number);toast('Глава сохранена');render();return}
 if(f.dataset.sub){const v=f.querySelector('input').value.trim()||null;const r=await sb.from('submissions').update({teacher_comment:v}).eq('id',f.dataset.sub);if(r.error)throw r.error;const s=D.subs.find(s=>s.id===f.dataset.sub);if(s)s.teacher_comment=v;toast('Комментарий сохранён');return}
 }catch(err){const m=AUTHERR[err?.message];if(f.id==='f-auth'||f.id==='f-newpass'){U.authErr=m||err.message;render()}else fail(err)}
 finally{if(btn&&document.contains(btn))btn.disabled=false}});

/* ===== сессия ===== */
sb.auth.onAuthStateChange((ev,session)=>{
 if(ev==='PASSWORD_RECOVERY'){D.user=session?.user||null;U.recovery=true;render();return}
 const prev=D.user?.id;D.user=session?.user||null;
 if(!D.user){D.me=null;D.group=null;U.tab='home';render();return}
 if(prev!==D.user.id&&!U.recovery){D.me=null;render();setTimeout(boot,0)}});
try{speechSynthesis.getVoices()}catch(e){}
}
</script></body></html>
