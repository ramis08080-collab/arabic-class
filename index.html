<script>
{

/* ===== загрузка данных ===== */
async function loadContent(){
 const [c,w,l]=await Promise.all([sb.from('chapters').select('*').order('book').order('number'),sb.from('words').select('*').order('sort').order('id'),sb.from('dialog_lines').select('*').order('sort').order('id')]);

 const m=await sb.from('group_members').select('group_id').eq('student_id',D.user.id);if(m.error)throw m.error;

 const g=await sb.from('groups').select('*').eq('teacher_id',D.user.id).order('created_at');if(g.error)throw g.error;D.groups=g.data;

 if(!D.group||!D.groups.find(x=>x.id===D.group.id))D.group=D.groups[0];else D.group=D.groups.find(x=>x.id===D.group.id);
 const gid=D.group.id;
 const [mem,asg]=await Promise.all([sb.from('group_members').select('student_id,joined_at').eq('group_id',gid),sb.from('assignments').select('*').eq('group_id',gid).order('created_at',{ascending:false})]);
 if(mem.error)throw mem.error;if(asg.error)throw asg.error;D.asg=asg.data;
 const ids=mem.data.map(x=>x.student_id);
 const [p,s,wp]=await Promise.all([ids.length?sb.from('profiles').select('id,full_name,xp,streak,last_active').in('id',ids):{data:[]},D.asg.length?sb.from('submissions').select('*').in('assignment_id',D.asg.map(a=>a.id)):{data:[]},ids.length?sb.from('word_progress').select('*').in('student_id',ids):{data:[]}]);
 for(const r of [p,s,wp])if(r.error)throw r.error;D.members=p.data;D.subs=s.data;D.gprog=wp.data}
async function boot(){

 if(U.recovery)return `<div class="auth"><h1>Новый пароль</h1><form class="form card" id="f-newpass"><div><label for="np">Новый пароль</label><input type="password" id="np" minlength="6" required autocomplete="new-password"></div><div class="err">${esc(U.authErr)}</div><button class="btn">Сохранить</button></form></div>`;
 const reg=U.auth==='reg',fg=U.auth==='forgot';
 return `<div class="auth"><div class="cover"><div class="ar big">أَهْلًا وَسَهْلًا</div><p>Класс арабского по учебнику «Аль-Арабийя байна ядайк»</p></div>
 ${fg?'':`<div class="row" style="margin-bottom:12px"><button class="chip ${reg?'':'on'}" data-auth="login">Вход</button><button class="chip ${reg?'on':''}" data-auth="reg">Регистрация</button></div>`}
 <form class="form card" id="f-auth">
 ${fg?'<h3>Восстановление пароля</h3><p class="mut small" style="margin:0">Мы отправим ссылку для сброса пароля на вашу почту.</p>':''}
 ${reg?'<div><label for="a-name">Имя и фамилия</label><input type="text" id="a-name" required autocomplete="name"></div>':''}

 ${fg?'':`<div><label for="a-pass">Пароль${reg?' (не меньше 6 символов)':''}</label><input type="password" id="a-pass" minlength="6" required autocomplete="${reg?'new-password':'current-password'}"></div>`}
 <div class="err">${esc(U.authErr)}</div>
 <button class="btn" type="submit">${reg?'Зарегистрироваться':fg?'Отправить ссылку':'Войти'}</button>
 ${fg?'<button type="button" class="btn alt" data-auth="login">Назад ко входу</button>':reg?'':'<button type="button" class="chip" data-auth="forgot" style="justify-self:start">Забыли пароль?</button>'}
 </form></div>`}
const AUTHERR={'Invalid login credentials':'Неверная почта или пароль','User already registered':'Эта почта уже зарегистрирована','Email not confirmed':'Почта не подтверждена. Проверьте письмо'};

function render(){if(!D.user){$('app').innerHTML=authView();return}
 if(!D.me){$('app').innerHTML='<div class="loading">Загрузка…</div>';return}

 nav();$('app').innerHTML=(V[U.tab]||V.home)()}
const mySub=id=>D.subs.find(s=>s.assignment_id===id&&s.student_id===D.user.id);
const pending=()=>D.asg.filter(a=>!mySub(a.id));
const chName=id=>{const c=D.chapters.find(c=>c.id===id);return c?`Том ${c.book} · Глава ${c.number}`:'Все главы'};

const V={
join(){return `<div class="auth"><div class="cover"><div class="ar big">مَرْحَبًا</div><p>${esc(D.me.full_name)}, введите код группы, который дал вам учитель</p></div>
 <form class="form card" id="f-join"><div><label for="j-code">Код группы</label><input type="text" id="j-code" required maxlength="12" style="text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:22px" autocomplete="off"></div><button class="btn">Вступить в группу</button></form>
 <p class="mut small" style="text-align:center;margin-top:16px">Вы учитель? Напишите администратору, чтобы вам назначили роль учителя.</p></div>`},

home(){const me=D.me,p=pending()[0],xpIn=me.xp%200,dn=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],ti=(new Date().getDay()+6)%7;
 const act=me.last_active===today()?1:0;const run=me.streak&&(me.last_active===today()||me.last_active===new Date(Date.now()-864e5).toISOString().slice(0,10))?me.streak:0;
 const week=dn.map((_,i)=>{const back=ti-i;if(back<0)return 0;const end=act?0:1;return back>=end&&back<end+run?1:0});
 const ws=W();const wd=ws.length?ws[new Date().getDate()%ws.length]:null;
 const board=D.members.slice().sort((a,b)=>b.xp-a.xp);const my=board.findIndex(b=>b.id===me.id);
 const ch=D.chapters.find(c=>c.id===U.ch)||D.chapters[0];
 return `<section class="cover"><div><div class="ar big">أَهْلًا وَسَهْلًا</div><p>${esc(me.full_name)}, рады вас видеть! Несколько минут в день — и слова запомнятся.</p>
 <div class="stat"><div><b>${run}</b>дней подряд</div><div><b>${me.xp}</b>очков</div><div><b>${lvl()}</b>уровень</div></div>
 <div class="lvl"><i style="width:${xpIn/2}%"></i></div><p class="small">${200-xpIn} очков до уровня ${lvl()+1}</p></div>

 <div class="grid" style="margin-top:14px">
 ${ch?`<div class="card"><span class="tag">Продолжить</span><h3 style="margin-top:8px">Том ${ch.book} · Глава ${ch.number}</h3><p class="mut small" style="margin:0 0 12px">${esc(ch.title)} · ${chWords(ch.id).length} слов</p><button class="btn" data-act="open" data-id="${ch.id}">Открыть урок</button></div>`:''}
 <div class="card">${p?`<span class="tag late">Задание до ${fmt(p.due_date)}</span><h3 style="margin-top:8px">${esc(p.title)}</h3><p class="mut small" style="margin:0 0 12px">${TYPES[p.type]} · ${p.question_count} вопросов</p><button class="btn" data-act="hw" data-id="${p.id}">Выполнить</button>`:`<span class="tag ok">Все задания сданы</span><h3 style="margin-top:8px">Отлично!</h3><p class="mut small">Новые задания появятся здесь.</p>`}</div>
 ${wd?`<div class="card" style="text-align:center"><span class="tag">Слово дня</span><div class="ar" style="font-size:42px;margin:6px 0">${A(wd.ar)}</div><div class="mut">${esc(wd.ru)}</div><button class="play" style="margin:10px auto 0" data-say="w:${wd.id}" aria-label="Слушать">${PLAY}</button></div>`:''}
 </div>
 <h2>Рейтинг группы «${esc(D.group.name)}»</h2><div class="list">${board.slice(0,5).map((b,i)=>`<div class="item" ${b.id===me.id?'style="border-color:var(--sun)"':''}><b style="width:24px">${i+1}</b><span class="grow">${esc(b.full_name)}${b.id===me.id?' (вы)':''}</span><b>${b.xp}</b></div>`).join('')}
 ${my>4?`<div class="item" style="border-color:var(--sun)"><b style="width:24px">${my+1}</b><span class="grow">Вы</span><b>${me.xp}</b></div>`:''}</div>`},

lessons(){if(U.lessonOpen)return V.lesson();
 const books=[...new Set(D.chapters.map(c=>c.book))];
 if(!books.length)return `<h1>Уроки</h1><p class="mut">Учитель ещё не добавил главы.</p>`;
 const ico='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>';
 const ul=n=>{const a=n%10,b=n%100;return a===1&&b!==11?'урок':a>=2&&a<=4&&(b<12||b>14)?'урока':'уроков'};
 if(!U.book||!books.includes(U.book))return `<h1>Выберите том</h1><div class="vols">${books.map(b=>{const cs=D.chapters.filter(c=>c.book===b),ws=D.words.filter(w=>cs.some(c=>c.id===w.chapter_id)),k=isT()?0:ws.filter(w=>D.prog.get(w.id)?.known).length,pc=ws.length?Math.round(k*100/ws.length):0;
  return `<button class="vol" data-act="book" data-id="${b}" aria-label="Том ${b}, ${cs.length} ${ul(cs.length)}"><img src="img/t${b}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="vt">Том ${b}</span><span class="vn">${ico}${cs.length} ${ul(cs.length)}</span>${isT()?'':`<span class="vbar" title="Изучено ${pc}% слов"><i style="width:${pc}%"></i></span>`}</button>`}).join('')}</div>`;
 const b=U.book;
 return `<button class="chip" data-act="books">← Все тома</button><h1 style="margin-top:14px">Том ${b}</h1><div class="chap" style="margin-top:12px">${D.chapters.filter(c=>c.book===b).map(c=>{const n=chWords(c.id).length,k=chWords(c.id).filter(w=>D.prog.get(w.id)?.known).length;return `<button class="ch ${c.id===U.ch?'cur':''}" data-act="open" data-id="${c.id}"><b>${c.number}</b><span class="small">${esc(c.title)}</span><br><span class="small" style="opacity:.8">${isT()?n+' слов':k+' из '+n+' слов'}</span></button>`}).join('')}</div>`},

lesson(){const c=D.chapters.find(x=>x.id===U.ch);if(!c){U.lessonOpen=false;return V.lessons()}
 if(U.part)return V.part(c);
 const ws=chWords(c.id),ls=chLines(c.id);
 const nums=[...new Set([...ls.map(LN),...ws.map(LN)])].sort((x,y)=>x-y);
 return `<button class="chip" data-act="back">← Все главы</button>
 <div class="lhd"><div class="small mut" style="letter-spacing:.08em;font-weight:800">ГЛАВА ${c.number}</div>${c.title_ar?`<div class="ar">${A(c.title_ar)}</div>`:''}<div style="font-weight:700">${esc(c.title)}</div></div>
 ${nums.map(n=>{const lw=ws.filter(w=>LN(w)===n),ll=ls.filter(l=>LN(l)===n);const read=ll.some(l=>/Чтение|Текст/.test(l.section||''));
  const k=ll.find(l=>l.ru)?.ru;
  return `<div class="les"><div class="lh"><div class="lt"><span class="ar">${A(ORD[n]||('الدَّرْسُ '+ADIG(n)))}</span><span class="small mut">${ORU[n]||('Урок '+n)}</span></div><div class="ln">${ADIG(n)}</div></div>
  ${ll.length?`<button class="li" data-act="part" data-k="d" data-les="${n}"><span>${(()=>{const t=(ll[0].section||'').split('·').slice(1).join('·').trim();return t.includes(':')?esc(t):(read?'Текст':'Диалог')})()}<span class="sub">${ll.length} ${read?'предл.':'реплик'}</span></span><span class="ic">📖</span></button>`:''}
  ${lw.length?`<button class="li" data-act="part" data-k="w" data-les="${n}"><span>Словарь<span class="sub">${lw.length} слов</span></span><span class="ic">🔤</span></button>`:''}
  ${(lw.length||ll.length)?`<button class="li" data-act="part" data-k="x" data-les="${n}"><span>Упражнения</span><span class="ic">🧩</span></button>`:''}</div>`}).join('')}
 <div class="les"><div class="lh"><div class="lt"><span class="ar">${A('خُلاصَةُ الوَحْدَةِ')}</span><span class="small mut">Итог главы</span></div><div class="ln">★</div></div>
 ${c.grammar?`<button class="li" data-act="part" data-k="g"><span>Грамматика</span><span class="ic">📐</span></button>`:''}
 ${ws.length>=4?`<button class="li" data-act="part" data-k="x" data-les="0"><span>Упражнения по всей главе<span class="sub">${ws.length} слов</span></span><span class="ic">🏁</span></button>`:''}</div>`},

part(c){const k=U.part.k,n=U.part.les;const ws=chWords(c.id).filter(w=>!n||LN(w)===n),ls=chLines(c.id).filter(l=>!n||LN(l)===n);
 const head=`<button class="chip" data-act="partback">← Глава ${c.number}</button>
 <div class="lhd"><div class="small mut" style="font-weight:800">ГЛАВА ${c.number}${n?' · '+(ORU[n]||'Урок '+n).toUpperCase():''}</div>${n?`<div class="ar" style="font-size:26px">${A(ORD[n]||'')}</div>`:''}<div style="font-weight:700">${k==='d'?'Диалог':k==='w'?'Словарь':k==='g'?'Грамматика':n?'Упражнения':'Упражнения по всей главе'}</div></div>`;
 const tog=`<div class="row" style="margin:12px 0;justify-content:center"><button class="chip ${U.har?'on':''}" data-act="har">Огласовки</button><button class="chip ${U.ru?'on':''}" data-act="ru">Перевод</button></div>`;
 if(k==='w')return head+tog+`<div class="wcards">${ws.map(w=>`<button class="wc" data-say="w:${w.id}"><span class="ar">${A(w.ar)}</span><span class="small mut">${esc(w.tr)}</span>${U.ru?`<div style="font-weight:700;margin-top:4px">${esc(w.ru)}</div>`:''}${w.plural?`<div class="small mut">мн. ч. <span class="ar">${A(w.plural)}</span></div>`:''}${w.root?`<div class="small mut">корень <span class="ar">${esc(w.root)}</span></div>`:''}</button>`).join('')}</div>
  <div class="row" style="margin-top:16px;justify-content:center"><button class="btn" data-act="cards" data-ch="${c.id}" data-les="${n}">Карточки</button><button class="btn alt" data-act="part" data-k="x" data-les="${n}">К упражнениям</button></div>`;
 if(k==='d')return head+tog+`<p class="mut small" style="text-align:center;margin-top:-4px">Нажмите на фразу, чтобы услышать её. Выключите перевод, чтобы проверить себя.</p>
  ${[...new Set(ls.map(l=>l.section||''))].map(sec=>`${sec?`<h3 style="margin:22px 0 4px;color:var(--ind)">${esc(sec)}</h3>`:''}<div>${ls.filter(l=>(l.section||'')===sec).map(l=>`<div class="line" data-say="l:${l.id}">${l.speaker_name?`<span class="who ${l.speaker==='b'?'b':l.speaker==='c'?'c':''}" title="${esc(l.speaker_name)}"><span class="ar" style="font-size:18px;line-height:1">${esc(strip(l.speaker_name).slice(0,1))}</span></span>`:'<span class="who" style="background:var(--line)"></span>'}<div>${l.speaker_name?`<div class="small mut ar" style="text-align:right">${A(l.speaker_name)}</div>`:''}<span class="ar">${A(l.ar)}</span>${U.ru?`<div class="mut">${esc(l.ru)}</div>`:''}</div></div>`).join('')}</div>`).join('')}
  ${ws.length?`<div class="row" style="margin-top:16px;justify-content:center"><button class="btn" data-act="part" data-k="w" data-les="${n}">Словарь урока</button></div>`:''}`;
 if(k==='g')return head+`<div class="card gram">${esc(c.grammar)}</div>`;
 const L=n||0,many=ws.length>=4||chWords(c.id).length>=4;
 return head+`<p class="mut" style="text-align:center">Выберите упражнение. Слова, в которых вы ошибаетесь, попадаются чаще.</p><div class="list" style="max-width:520px;margin:12px auto">
 ${many?`<button class="li" data-act="quiz" data-type="mix" data-n="${n?6:10}" data-ch="${c.id}" data-les="${L}"><span>Смешанный тест<span class="sub">перевод, аудирование</span></span><span class="ic">✅</span></button>
 <button class="li" data-act="cards" data-ch="${c.id}" data-les="${L}"><span>Карточки<span class="sub">знаю / учу</span></span><span class="ic">🃏</span></button>
 <button class="li" data-act="quiz" data-type="listen" data-n="6" data-ch="${c.id}" data-les="${L}"><span>Аудирование<span class="sub">услышь и выбери</span></span><span class="ic">🎧</span></button>
 <button class="li" data-act="quiz" data-type="ru2ar" data-n="6" data-ch="${c.id}" data-les="${L}"><span>Обратный перевод<span class="sub">с русского на арабский</span></span><span class="ic">🔁</span></button>`:''}
 ${ls.some(l=>l.ar.trim().split(/\s+/).length>1)?`<button class="li" data-act="quiz" data-type="build" data-n="4" data-ch="${c.id}" data-les="${L}"><span>Сборка фраз<span class="sub">из диалога</span></span><span class="ic">🧱</span></button>`:''}
 ${!many&&!ls.length?'<p class="mut">В этом уроке пока нет материала для упражнений.</p>':''}</div>`},

words(){const q=U.q.trim().toLowerCase();const pr=id=>D.prog.get(id)||{};
 const list=W().filter(w=>(U.filter==='all'||(U.filter==='known'?pr(w.id).known:U.filter==='learn'?!pr(w.id).known:(pr(w.id).mistakes||0)>0))&&(!q||w.ru.toLowerCase().includes(q)||strip(w.ar).includes(strip(q))||(w.tr||'').toLowerCase().includes(q)));
 const kn=W().filter(w=>pr(w.id).known).length;
 return `<h1>Мои слова</h1><p class="mut">${kn} из ${W().length} выучено. Слова с ошибками попадаются в тестах чаще.</p>
 <div class="row" style="margin:14px 0"><button class="btn" data-act="cards">Карточки</button><button class="btn alt" data-act="quiz" data-type="mix" data-n="8">Тест по всем словам</button></div>
 <input type="search" id="q" placeholder="Поиск по-русски или по-арабски" value="${esc(U.q)}" aria-label="Поиск">
 <div class="row" style="margin:12px 0">${[['all','Все'],['learn','Учу'],['known','Знаю'],['mist','С ошибками']].map(([k,t])=>`<button class="chip ${U.filter===k?'on':''}" data-filter="${k}">${t}</button>`).join('')}</div>
 <div class="list">${list.length?list.map(w=>`<div class="item"><button class="play" data-say="w:${w.id}" aria-label="Слушать">${PLAY}</button><div class="grow"><b>${esc(w.ru)}</b><div class="small mut">${esc(w.tr)}${pr(w.id).mistakes?` · ошибок: ${pr(w.id).mistakes}`:''}</div></div><span class="ar wrd">${A(w.ar)}</span><button class="chip ${pr(w.id).known?'on':''}" data-known="${w.id}">${pr(w.id).known?'Знаю':'Учу'}</button></div>`).join(''):'<p class="mut">Ничего не найдено.</p>'}</div>`},

hw(){return `<h1>Домашние задания</h1><p class="mut">Результат уходит учителю сразу после выполнения. Каждое задание сдаётся один раз.</p>
 <div class="list" style="margin-top:14px">${D.asg.length?D.asg.slice().sort((a,b)=>!!mySub(a.id)-!!mySub(b.id)||(a.due_date||'').localeCompare(b.due_date||'')).map(a=>{const s=mySub(a.id);const late=!s&&a.due_date&&a.due_date<today();

 return `<div class="row" style="justify-content:space-between"><div><h1>${esc(g.name)}</h1><p class="mut" style="margin:0">${rows.length} учеников</p></div>

stats(){if(!D.group)return V.group();
 const agg=new Map();for(const p of D.gprog)if(p.mistakes)agg.set(p.word_id,(agg.get(p.word_id)||0)+p.mistakes);
 const top=[...agg].map(([id,c])=>({w:D.words.find(w=>w.id===id),c})).filter(x=>x.w).sort((a,b)=>b.c-a.c).slice(0,10);const mx=top[0]?.c||1;
 const known=new Map();for(const p of D.gprog)if(p.known)known.set(p.student_id,(known.get(p.student_id)||0)+1);
 return `<h1>Где группе трудно</h1><p class="mut">Слова, в которых ученики группы «${esc(D.group.name)}» ошибались чаще всего.</p>
 <div class="card" style="margin-top:14px">${top.length?top.map(x=>`<div class="hbar"><span class="ar">${A(x.w.ar)}</span><span class="b" style="width:${x.c/mx*100}%"></span><b style="text-align:right">${x.c}</b></div>`).join(''):'<p class="mut" style="margin:0">Данных пока нет — они появятся после первых тестов.</p>'}</div>
 ${top.length?`<div class="row" style="margin-top:14px"><button class="btn" data-act="repeat">Задать повторение трудных слов</button></div>`:''}
 <h2>Выучено слов</h2><div class="card">${D.members.length?D.members.slice().sort((a,b)=>(known.get(b.id)||0)-(known.get(a.id)||0)).map(m=>{const k=known.get(m.id)||0;return `<div class="hbar" style="grid-template-columns:minmax(110px,200px) minmax(0,1fr) 48px"><span>${esc(m.full_name)}</span><span class="b" style="background:var(--ind);width:${W().length?k/W().length*100:0}%"></span><b style="text-align:right">${k}</b></div>`}).join(''):'<p class="mut" style="margin:0">В группе пока нет учеников.</p>'}</div>`}};

/* ===== тесты ===== */
let Q=null;
function pool(chId,ids){let ws=ids?D.words.filter(w=>ids.includes(w.id)):chId?chWords(chId):D.words;return ws}
function pickWords(ws,n){const p=ws.map(w=>({w,wt:1+(D.prog.get(w.id)?.mistakes||0)*2+(D.prog.get(w.id)?.known?0:1)}));const out=[];
 while(out.length<n&&p.length){let t=p.reduce((a,x)=>a+x.wt,0),r=Math.random()*t;let k=p.findIndex(x=>(r-=x.wt)<0);if(k<0)k=p.length-1;out.push(p[k].w);p.splice(k,1)}return out}
const opts=(w,ws,key)=>shuf([w,...shuf(ws.filter(x=>x.id!==w.id&&x[key]!==w[key])).slice(0,3)]);
function makeQ(type,n,chId,ids,les){const base=pool(chId,ids);let ws=les?base.filter(w=>LN(w)===les):base;const dp=ws.length>=4?ws:base.length>=4?base:D.words;if(!ws.length)ws=base.length?base:D.words;
 if(type==='build'){const ls=(chId?chLines(chId):D.lines).filter(l=>!les||LN(l)===les).filter((l,i,a)=>a.findIndex(x=>x.ar===l.ar)===i&&l.ar.trim().split(/\s+/).length>1);
  if(ls.length){const all=D.lines.flatMap(x=>x.ar.trim().split(/\s+/));return shuf(ls).slice(0,n).map(l=>{const t=l.ar.trim().split(/\s+/);const extra=shuf(all.filter(w=>!t.includes(w))).slice(0,2);return {k:'build',l,t,tiles:shuf([...t,...extra])}})}
  type='mix'}
 const ks=['ar2ru','ru2ar','listen'];return pickWords(ws,n).map((w,j)=>{const k=type==='mix'?ks[j%3]:type;return {k,w,o:opts(w,dp,k==='ar2ru'?'ru':'ar')}})}
function startQuiz(type,n,chId,asgId,les){if(D.words.length<4){toast('Слишком мало слов для теста');return}
 Q={list:makeQ(type,n,chId,null,les),at:0,ok:0,bad:[],asgId,ans:null,built:[],pick:null};$('ov').classList.add('show');drawQ();if(Q.list[0].k==='listen')setTimeout(()=>say(Q.list[0].w),300)}
function drawQ(){const q=Q.list[Q.at];let body='';
 if(q.k==='ar2ru')body=`<div class="qask">Выберите перевод</div><div class="ar qbig">${A(q.w.ar)}</div><div class="opts">${q.o.map(x=>`<button class="opt" data-o="${x.id}">${esc(x.ru)}</button>`).join('')}</div>`;
 if(q.k==='ru2ar')body=`<div class="qask">Как это по-арабски?</div><div class="qru">${esc(q.w.ru)}</div><div class="opts">${q.o.map(x=>`<button class="opt ar" data-o="${x.id}">${A(x.ar)}</button>`).join('')}</div>`;
 if(q.k==='listen')body=`<div class="qask">Послушайте и выберите слово</div><div style="text-align:center;margin:10px 0 20px"><button class="play" style="width:96px;height:96px;margin:auto" data-say="w:${q.w.id}" aria-label="Слушать"><svg viewBox="0 0 24 24" fill="currentColor" style="width:40px;height:40px"><path d="M8 5v14l11-7z"/></svg></button></div><div class="opts">${q.o.map(x=>`<button class="opt ar" data-o="${x.id}">${A(x.ar)}</button>`).join('')}</div>`;
 if(q.k==='build')body=`<div class="qask">Соберите фразу по-арабски</div><div class="qru">${esc(q.l.ru)}</div><div class="built">${Q.built.map((ti,p)=>`<button class="tile" data-un="${p}">${A(q.tiles[ti])}</button>`).join('')}</div><div class="tiles">${q.tiles.map((t,ti)=>`<button class="tile ${Q.built.includes(ti)?'used':''}" data-ti="${ti}">${A(t)}</button>`).join('')}</div>`;
 let fb='';if(Q.ans!=null){const right=q.k==='build'?q.l.ar:q.k==='ar2ru'?q.w.ru:q.w.ar;
  fb=`<div class="fbbox ${Q.ans?'g':'w'}">${Q.ans?'Верно! +10 очков':'Правильный ответ:'} ${Q.ans?'':(q.k==='ar2ru'?`<div>${esc(right)}</div>`:`<div class="ar">${A(right)}</div>`)}</div><button class="btn" style="width:100%" data-act="next">${Q.at+1<Q.list.length?'Дальше':'Завершить'}</button>`}
 else if(q.k==='build')fb=`<button class="btn" style="width:100%" data-act="check" ${Q.built.length?'':'disabled'}>Проверить</button>`;
 $('ov').innerHTML=`<div class="qz"><div class="qtop"><button class="x" data-act="close" aria-label="Закрыть">×</button><div class="prog"><i style="width:${Q.at/Q.list.length*100}%"></i></div></div>${body}<div class="fb">${fb}</div></div>`;
 if(Q.ans!=null&&q.k!=='build')document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.o===q.w.id)b.classList.add('good');else if(+b.dataset.o===Q.pick)b.classList.add('wrong')})}
function answer(good){const q=Q.list[Q.at];Q.ans=good;if(good)Q.ok++;else Q.bad.push(q);drawQ();if(q.k==='build')say({ar:q.l.ar,audio_url:q.l.audio_url});else if(q.k==='ar2ru')say(q.w)}
async function finish(){const n=Q.list.length,sc=Math.round(Q.ok/n*100),xp=Q.ok*10+(sc===100?20:0);const asgId=Q.asgId,bad=Q.bad;
 $('ov').innerHTML=`<div class="qz"><div class="loading">Сохраняем результат…</div></div>`;
 let sent=false;
 try{
  if(!isT()){
   const r=await sb.rpc('add_xp',{amount:Math.min(xp,200)});if(r.error)throw r.error;
   const badW=[...new Set(bad.filter(q=>q.w).map(q=>q.w.id))];
   if(badW.length){const rows=badW.map(id=>{const p=D.prog.get(id)||{};return {student_id:D.user.id,word_id:id,known:!!p.known,mistakes:(p.mistakes||0)+1,updated_at:new Date().toISOString()}});
    const u=await sb.from('word_progress').upsert(rows);if(u.error)throw u.error;rows.forEach(r=>D.prog.set(r.word_id,r))}
   if(asgId){const s=await sb.from('submissions').insert({assignment_id:asgId,student_id:D.user.id,score:sc,answers:{bad:badW,total:n}}).select().single();if(s.error)throw s.error;D.subs.push(s.data);sent=true}
   await loadMe();const m=D.members.find(x=>x.id===D.me.id);if(m)Object.assign(m,{xp:D.me.xp,streak:D.me.streak,last_active:D.me.last_active})}
 }catch(e){fail(e)}
 $('ov').innerHTML=`<div class="qz"><div class="res"><div class="mut" style="font-weight:700">${sc>=90?'Отличная работа!':sc>=60?'Хороший результат':'Стоит повторить'}</div><div class="score">${sc}%</div><p>${Q.ok} из ${n} верно${isT()?'':` · <b>+${xp} очков</b>`}${sc===100&&!isT()?' (бонус за 100%)':''}</p>${sent?'<p><span class="tag ok">Результат отправлен учителю</span></p>':''}</div>
 ${bad.length?`<h2>Повторить</h2><div class="list">${bad.map(q=>q.k==='build'?`<div class="item"><span class="grow">${esc(q.l.ru)}</span><span class="ar wrd">${A(q.l.ar)}</span></div>`:`<div class="item"><button class="play" data-say="w:${q.w.id}">${PLAY}</button><span class="grow">${esc(q.w.ru)}</span><span class="ar wrd">${A(q.w.ar)}</span></div>`).join('')}</div>`:''}
 <div class="fb"><button class="btn" style="width:100%" data-act="close">Готово</button></div></div>`}

/* ===== карточки ===== */
let F=null;
function startCards(chId,les){const ws=(chId?chWords(chId):D.words).filter(w=>!les||LN(w)===les);if(!ws.length){toast('Слов пока нет');return}
 const un=ws.filter(w=>!D.prog.get(w.id)?.known),kn=ws.filter(w=>D.prog.get(w.id)?.known);
 F={list:shuf(un).concat(shuf(kn)),at:0,dir:'ar',fl:false,kn:0};$('ov').classList.add('show');drawF()}
function drawF(){if(F.at>=F.list.length){$('ov').innerHTML=`<div class="qz"><div class="res"><div class="score">${F.kn}</div><p>слов отмечено «знаю» из ${F.list.length}</p></div><div class="fb"><button class="btn" style="width:100%" data-act="close">Готово</button></div></div>`;return}
 const w=F.list[F.at];const front=F.dir==='ar'?`<span class="ar">${A(w.ar)}</span>`:`<b style="font-size:30px">${esc(w.ru)}</b>`;const back=F.dir==='ar'?`<div><b style="font-size:28px">${esc(w.ru)}</b><div class="mut">${esc(w.tr)}</div></div>`:`<div><span class="ar">${A(w.ar)}</span><div class="mut">${esc(w.tr)}</div></div>`;
 $('ov').innerHTML=`<div class="qz"><div class="qtop"><button class="x" data-act="close" aria-label="Закрыть">×</button><div class="prog"><i style="width:${F.at/F.list.length*100}%"></i></div><span class="small mut">${F.at+1}/${F.list.length}</span></div>
 <div class="row" style="margin-top:14px;justify-content:center"><button class="chip ${F.dir==='ar'?'on':''}" data-dir="ar">Арабский → русский</button><button class="chip ${F.dir==='ru'?'on':''}" data-dir="ru">Русский → арабский</button></div>
 <div class="flash ${F.fl?'fl':''}" id="fc" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="fcin"><div class="face">${front}</div><div class="face bk">${back}</div></div></div>
 <p class="mut small" style="text-align:center;margin-top:-8px">Нажмите на карточку, чтобы перевернуть</p>
 <div class="fb row" style="justify-content:center"><button class="play" data-say="w:${w.id}" aria-label="Слушать">${PLAY}</button><button class="btn alt" data-fc="0" style="flex:1">Повторить</button><button class="btn" data-fc="1" style="flex:1">Знаю</button></div></div>`}
async function setKnown(id,known){const p=D.prog.get(id)||{};const row={student_id:D.user.id,word_id:id,known,mistakes:p.mistakes||0,updated_at:new Date().toISOString()};D.prog.set(id,row);
 if(isT())return;const r=await sb.from('word_progress').upsert(row);if(r.error)fail(r.error)}

/* ===== аудио учителя ===== */
async function uploadAudio(key,blob){const [t,id]=key.split(':');const ext=(blob.type.includes('mp4')||blob.type.includes('m4a'))?'m4a':blob.type.includes('mpeg')?'mp3':blob.type.includes('ogg')?'ogg':blob.type.includes('wav')?'wav':'webm';
 const path=`${t==='w'?'words':t==='l'?'lines':'chapters'}/${id}-${Date.now()}.${ext}`;
 const up=await sb.storage.from('audio').upload(path,blob,{contentType:blob.type||'audio/mpeg',upsert:false});if(up.error)throw up.error;
 const url=sb.storage.from('audio').getPublicUrl(path).data.publicUrl;
 const tbl=t==='w'?'words':t==='l'?'dialog_lines':'chapters',col=t==='c'?'dialog_audio':'audio_url';
 const r=await sb.from(tbl).update({[col]:url}).eq('id',+id);if(r.error)throw r.error;
 const arr=t==='w'?D.words:t==='l'?D.lines:D.chapters;const o=arr.find(x=>x.id===+id);if(o)o[col]=url;toast('Аудио сохранено');render()}
let REC=null;
async function toggleRec(btn,key){
 if(REC){REC.mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];
  mr.ondataavailable=e=>ch.push(e.data);mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:mr.mimeType||'audio/webm'});REC=null;try{await uploadAudio(key,b)}catch(e){fail(e);render()}};
  REC={mr};mr.start();btn.classList.add('rec');btn.textContent='■ Стоп'}catch(e){toast('Нет доступа к микрофону')}}

/* ===== сохранение материала ===== */
async function saveRows(sel,tbl,arr){const rows=[...document.querySelectorAll(sel)].map(tr=>{const id=+tr.dataset[sel==='tr[data-w]'?'w':'l'];const o={id};tr.querySelectorAll('[data-f]').forEach(i=>{o[i.dataset.f]=i.value.trim()||null});return o});
 for(const o of rows){if(!o.ar||!o.ru){toast('У каждой строки должны быть арабский текст и перевод');return}}
 for(const o of rows){const {id,...rest}=o;const r=await sb.from(tbl).update(rest).eq('id',id);if(r.error)return fail(r.error);Object.assign(arr.find(x=>x.id===id),rest)}
 toast('Сохранено');render()}
async function ttsErr(e){try{const j=await e.context.json();return j.error||e.message}catch(_){return e?.message||'Ошибка озвучки'}}
async function reloadAll(){if(isT())await loadTeacher();else await loadStudent();render()}

/* ===== события ===== */
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-say],#fc');if(!t)return;const d=t.dataset;
 try{
 if(d.auth){U.auth=d.auth;U.authErr='';render();return}
 if(t.id==='logout'){await sb.auth.signOut();return}
 if(d.tab){if(d.tab==='lessons')U.book=null;U.tab=d.tab;U.lessonOpen=false;U.part=null;U.openAsg=null;render();window.scrollTo(0,0);return}
 if(t.id==='fc'){F.fl=!F.fl;$('fc').classList.toggle('fl',F.fl);return}
 if(d.dir){F.dir=d.dir;F.fl=false;drawF();return}
 if(d.fc!=null){const w=F.list[F.at];if(d.fc==='1')F.kn++;setKnown(w.id,d.fc==='1');F.at++;F.fl=false;drawF();return}
 if(d.o!=null&&Q&&Q.ans==null){Q.pick=+d.o;answer(+d.o===Q.list[Q.at].w.id);return}
 if(d.ti!=null&&Q&&Q.ans==null){Q.built.push(+d.ti);drawQ();return}
 if(d.un!=null&&Q&&Q.ans==null){Q.built.splice(+d.un,1);drawQ();return}
 if(d.filter){U.filter=d.filter;render();return}
 if(d.known!=null){const id=+d.known;await setKnown(id,!D.prog.get(id)?.known);render();return}
 if(d.rec){toggleRec(t,d.rec);return}
 if(d.tts){t.disabled=true;t.textContent='…';const r=await sb.functions.invoke('tts',{body:{item:d.tts}});if(r.error||r.data?.error)throw new Error(r.data?.error||await ttsErr(r.error));if(r.data.errors?.length)toast(r.data.errors[0]);else toast('Озвучено');await loadContent();render();return}
 if(d.say!=null){const o=byKey(d.say);if(o)say(o,t.classList.contains('line')?t:null);return}
 const a=d.act;if(!a)return;
 if(a==='open'){U.ch=+d.id;U.book=D.chapters.find(c=>c.id===U.ch)?.book;U.tab='lessons';U.lessonOpen=true;U.part=null;render();window.scrollTo(0,0)}
 else if(a==='back'){U.lessonOpen=false;U.part=null;render()}
 else if(a==='book'){U.book=+d.id;render();window.scrollTo(0,0)}
 else if(a==='books'){U.book=null;render();window.scrollTo(0,0)}
 else if(a==='har'){U.har=!U.har;render()}
 else if(a==='ru'){U.ru=!U.ru;render()}
 else if(a==='rate'){U.rate=U.rate===.85?.6:U.rate===.6?1.05:.85;render()}
 else if(a==='quiz')startQuiz(d.type,+d.n,d.ch?+d.ch:null,null,+d.les||0);
 else if(a==='part'){U.part={k:d.k,les:+d.les||0};render();window.scrollTo(0,0)}
 else if(a==='partback'){U.part=null;render();window.scrollTo(0,0)}
 else if(a==='hw'){const x=D.asg.find(x=>x.id===d.id);if(x)startQuiz(x.type,x.question_count,x.chapter_id,x.id)}
 else if(a==='cards')startCards(d.ch?+d.ch:null,+d.les||0);
 else if(a==='check'){const q=Q.list[Q.at];answer(Q.built.map(ti=>q.tiles[ti]).join(' ')===q.t.join(' '))}
 else if(a==='next'){Q.at++;Q.ans=null;Q.built=[];Q.pick=null;if(Q.at>=Q.list.length)await finish();else{drawQ();const q=Q.list[Q.at];if(q.k==='listen')say(q.w)}}
 else if(a==='close'){$('ov').classList.remove('show');$('ov').innerHTML='';Q=null;F=null;try{speechSynthesis.cancel()}catch(e){}render()}
 else if(a==='copy'){const txt=`Ассаляму алейкум! Приложение для уроков арабского: ${location.origin+location.pathname}\nЗарегистрируйтесь и введите код группы: ${d.v}`;try{await navigator.clipboard.writeText(txt);toast('Приглашение скопировано')}catch(e){toast('Код: '+d.v)}}
 else if(a==='asgopen'){U.openAsg=d.id;render();window.scrollTo(0,0)}
 else if(a==='asgback'){U.openAsg=null;render()}
 else if(a==='asgdel'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Точно удалить? Результаты учеников тоже удалятся';return}
  const r=await sb.from('assignments').delete().eq('id',d.id);if(r.error)throw r.error;U.openAsg=null;toast('Задание удалено');await reloadAll()}
 else if(a==='repeat'){const agg=new Map();for(const p of D.gprog)if(p.mistakes)agg.set(p.word_id,(agg.get(p.word_id)||0)+p.mistakes);
  const r=await sb.from('assignments').insert({group_id:D.group.id,title:'Повторение трудных слов',type:'mix',question_count:Math.min(10,Math.max(4,agg.size)),due_date:new Date(Date.now()+3*864e5).toISOString().slice(0,10)});if(r.error)throw r.error;toast('Задание отправлено группе');await reloadAll()}
 else if(a==='newch'){const b=D.chapters.at(-1);const book=b?.book||1,num=b?b.number+1:1;const r=await sb.from('chapters').insert({book,number:num,title:'Новая глава'}).select().single();if(r.error)throw r.error;D.chapters.push(r.data);U.matCh=r.data.id;render()}
 else if(a==='delch'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Точно удалить главу со всеми словами?';return}
  const r=await sb.from('chapters').delete().eq('id',+d.id);if(r.error)throw r.error;D.chapters=D.chapters.filter(c=>c.id!==+d.id);D.words=D.words.filter(w=>w.chapter_id!==+d.id);D.lines=D.lines.filter(l=>l.chapter_id!==+d.id);U.matCh=D.chapters[0]?.id||null;toast('Глава удалена');render()}
 else if(a==='ttsch'){t.disabled=true;const st=$('tts-st');let total=0,sum=0;
  for(let i=0;i<60;i++){const r=await sb.functions.invoke('tts',{body:{chapter_id:+d.id}});if(r.error||r.data?.error){t.disabled=false;throw new Error(r.data?.error||await ttsErr(r.error))}
   const x=r.data;if(!total)total=x.total;sum+=x.done;if(st)st.textContent=`Озвучено ${sum} из ${total}…`;if(x.errors?.length)toast(x.errors[0]);if(!x.remaining||!x.done)break}
  toast(`Готово: озвучено ${sum}`);await loadContent();render()}
 else if(a==='savew')await saveRows('tr[data-w]','words',D.words);
 else if(a==='savel')await saveRows('tr[data-l]','dialog_lines',D.lines);
 else if(a==='addw'){const s=chWords(U.matCh).length+1;const r=await sb.from('words').insert({chapter_id:U.matCh,ar:'—',ru:'—',sort:s,lesson:chWords(U.matCh).at(-1)?.lesson||1}).select().single();if(r.error)throw r.error;D.words.push(r.data);render()}
 else if(a==='addl'){const s=chLines(U.matCh).length+1;const prev=chLines(U.matCh).at(-1);const r=await sb.from('dialog_lines').insert({chapter_id:U.matCh,ar:'—',ru:'—',speaker:s%2?'a':'b',section:prev?.section||null,lesson:prev?.lesson||1,sort:(prev?.sort||0)+1}).select().single();if(r.error)throw r.error;D.lines.push(r.data);render()}
 else if(a==='delw'||a==='dell'){const tbl=a==='delw'?'words':'dialog_lines';const r=await sb.from(tbl).delete().eq('id',+d.id);if(r.error)throw r.error;if(a==='delw')D.words=D.words.filter(w=>w.id!==+d.id);else D.lines=D.lines.filter(l=>l.id!==+d.id);render()}
 else if(a==='import'){const lines=$('imp').value.split('\n').map(s=>s.trim()).filter(Boolean);let s=chWords(U.matCh).length;
  const rows=lines.map(l=>l.split(/\s*[|\t]\s*/)).filter(p=>p[0]&&p[1]).map(p=>({chapter_id:U.matCh,ar:p[0],ru:p[1],tr:p[2]||null,sort:++s}));
  if(!rows.length){toast('Не найдено строк вида «арабский | перевод»');return}
  const r=await sb.from('words').insert(rows).select();if(r.error)throw r.error;D.words.push(...r.data);toast(`Добавлено слов: ${r.data.length}`);render()}
 }catch(err){fail(err)}
});
document.addEventListener('keydown',e=>{if(e.target.id==='fc'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){U.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{const t=e.target;try{
 if(t.id==='g-sel'){D.group=D.groups.find(g=>g.id===t.value);U.openAsg=null;await loadTeacher();render()}
 else if(t.id==='m-ch'){U.matCh=+t.value;render()}
 else if(t.dataset.up&&t.files[0])await uploadAudio(t.dataset.up,t.files[0]);
 else if(t.dataset.upch&&t.files[0])await uploadAudio('c:'+t.dataset.upch,t.files[0]);
 }catch(err){fail(err)}});
document.addEventListener('submit',async e=>{const f=e.target;e.preventDefault();const btn=f.querySelector('button:not([type=button])');if(btn)btn.disabled=true;
 try{
 if(f.id==='f-auth'){U.authErr='';const email=$('a-email').value.trim();
  if(U.auth==='forgot'){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;U.auth='login';U.authErr='';toast('Ссылка отправлена. Проверьте почту');render();return}
  const pass=$('a-pass').value;
  if(U.auth==='reg'){const name=$('a-name').value.trim();const r=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;
   if(!r.data.session){U.auth='login';toast('Мы отправили письмо для подтверждения почты');render()}return}
  const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error;return}
 if(f.id==='f-newpass'){const r=await sb.auth.updateUser({password:$('np').value});if(r.error)throw r.error;U.recovery=false;toast('Пароль изменён');boot();return}
 if(f.id==='f-join'){const r=await sb.rpc('join_group',{code:$('j-code').value});if(r.error)throw r.error;toast('Вы в группе!');U.tab='home';await loadStudent();render();return}
 if(f.id==='f-group'){const r=await sb.from('groups').insert({name:$('g-name').value.trim(),teacher_id:D.user.id}).select().single();if(r.error)throw r.error;D.group=r.data;toast('Группа создана');await loadTeacher();render();return}
 if(f.id==='f-asg'){const ch=$('a-c').value;const r=await sb.from('assignments').insert({group_id:D.group.id,title:$('a-t').value.trim(),type:$('a-y').value,question_count:+$('a-n').value,chapter_id:ch?+ch:null,due_date:$('a-d').value||null});if(r.error)throw r.error;toast('Задание отправлено группе');await loadTeacher();render();return}
 if(f.id==='f-ch'){const c=D.chapters.find(x=>x.id===U.matCh);const upd={book:+$('c-b').value||1,number:+$('c-n').value||1,title:$('c-t').value.trim()||'Без названия',title_ar:$('c-ta').value.trim()||null,grammar:$('c-g').value.trim()||null};
  const r=await sb.from('chapters').update(upd).eq('id',c.id);if(r.error)throw r.error;Object.assign(c,upd);D.chapters.sort((a,b)=>a.book-b.book||a.number-b.number);toast('Глава сохранена');render();return}
 if(f.dataset.sub){const v=f.querySelector('input').value.trim()||null;const r=await sb.from('submissions').update({teacher_comment:v}).eq('id',f.dataset.sub);if(r.error)throw r.error;const s=D.subs.find(s=>s.id===f.dataset.sub);if(s)s.teacher_comment=v;toast('Комментарий сохранён');return}
 }catch(err){const m=AUTHERR[err?.message];if(f.id==='f-auth'||f.id==='f-newpass'){U.authErr=m||err.message;render()}else fail(err)}
 finally{if(btn&&document.contains(btn))btn.disabled=false}});

/* ===== сессия ===== */
sb.auth.onAuthStateChange((ev,session)=>{
 if(ev==='PASSWORD_RECOVERY'){D.user=session?.user||null;U.recovery=true;render();return}
 const prev=D.user?.id;D.user=session?.user||null;
 if(!D.user){D.me=null;D.group=null;U.tab='home';render();return}
 if(prev!==D.user.id&&!U.recovery){D.me=null;render();setTimeout(boot,0)}});
try{speechSynthesis.getVoices()}catch(e){}
}
</script></body></html>
